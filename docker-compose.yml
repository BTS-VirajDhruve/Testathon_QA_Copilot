services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Optional — create via `cp .env.example .env` (not required for default demo)
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/data:/app/data
      - ./sample_data:/app/sample_data:ro
    environment:
      # Fastest hackathon demo path: durable JSON graph store (Neo4j optional below)
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_URI: bolt://neo4j:7687
      DATA_DIR: /app/data
      CHROMA_DIR: /app/data/chroma
      GRAPH_STORE_PATH: /app/data/graph_store.json
      ENABLE_DEMO_FALLBACK: ${ENABLE_DEMO_FALLBACK:-true}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  # Optional — enable with: NEO4J_ENABLED=true docker compose --profile neo4j up --build
  neo4j:
    image: neo4j:5.26-community
    profiles: ["neo4j"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
